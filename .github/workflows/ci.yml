# CI (F1): unit tests and a debug build on every push to main, every pull request, and on demand.
#
# This workflow never signs anything. Release signing stays on the maintainer's machine
# (signing/callvault-signing.keystore, gitignored), and no secret is available here.
#
# Checks beyond Gradle:
#   - tools/ci/check-version-floor.sh: the default versionCode must not be below the last shipped one
#     (tools/ci/versioncode-floor.txt), or the build could never install over a release.
#   - tools/ci/check-16kb-alignment.sh: our own native libraries must be 16 KB page aligned.
#
# Every `uses:` is pinned to a full commit SHA (tag in the comment), looked up 2026-11-21.

name: CI

on:
  # Owner approved CI on push 2026-11-21 (takes effect once 2.5.2 reaches main).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # whisper.cpp and llama.cpp are submodules and the native CMake build reads them directly.
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true
          cache-provider: basic # DO NOT REMOVE: the default "advanced caching" of v6 is under proprietary terms.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # NDK and CMake versions are pinned by app/build.gradle.kts (ndkVersion, externalNativeBuild.cmake.version).
      - name: Install pinned NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: versionCode is not below the shipped floor
        run: tools/ci/check-version-floor.sh

      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Our native libraries are 16 KB page aligned
        run: |
          tools/ci/check-16kb-alignment.sh \
            app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib/arm64-v8a \
            "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

      - name: Print the debug APK checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests
          retention-days: 14
          if-no-files-found: ignore
